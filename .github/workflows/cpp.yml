name: C++ core

on:
  push:
    paths: ["cpp/**", "pendulum_sim/quick/qml/**", "pendulum_sim/quick/fonts/**", ".github/workflows/cpp.yml"]
  pull_request:
    paths: ["cpp/**", "pendulum_sim/quick/qml/**", "pendulum_sim/quick/fonts/**", ".github/workflows/cpp.yml"]
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --config Release --parallel
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure

  app:
    name: Qt Quick app (Linux build, smoke test, screenshots, performance test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Xvfb and Mesa
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DPENDULUM_BUILD_APP=ON -DPENDULUM_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build cpp/build --parallel
      - name: Smoke test (every ported screen, fails on QML warnings)
        run: xvfb-run -a -s "-screen 0 1280x800x24" cpp/build/app/PendulumCpp --smoke-test 3 --size 1138x637
      - name: Screenshots
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x800x24" cpp/build/app/PendulumCpp --screenshot shots/simulate.png --size 1138x637
          xvfb-run -a -s "-screen 0 1280x800x24" cpp/build/app/PendulumCpp --screenshot shots/graphs.png --screen graphs --size 1138x637
          xvfb-run -a -s "-screen 0 1280x800x24" cpp/build/app/PendulumCpp --screenshot shots/portrait-dark.png --theme dark --scenario double_cart_lqr --size 900x1200
      - name: Performance test
        run: xvfb-run -a -s "-screen 0 1280x800x24" cpp/build/app/PendulumCpp --benchmark --size 1138x637 | tee shots/performance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-app-screenshots
          path: shots

  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # rolling pre-release "android-cpp-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - name: Debug keystore (cached, so a new APK installs over the old one)
        uses: actions/cache@v4
        with:
          path: ~/.android-cpp
          key: android-cpp-keystore-v1
      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S cpp -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DPENDULUM_BUILD_APP=ON -DPENDULUM_BUILD_TESTS=OFF -DPENDULUM_BUILD_BENCH=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" \
            -DQT_ANDROID_ABIS=arm64-v8a
      - name: Build APK
        run: cmake --build build-android --parallel --target apk
      - name: Sign
        run: |
          mkdir -p ~/.android-cpp
          KS=~/.android-cpp/debug.keystore
          [ -f "$KS" ] || keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          APK=$(find build-android -name "*.apk" -path "*outputs/apk/*" | head -1)
          echo "built: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --out PendulumCpp.apk aligned.apk
          "$BT/apksigner" verify PendulumCpp.apk
          ls -la PendulumCpp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PendulumCpp-apk
          path: PendulumCpp.apk
      # https://github.com/<owner>/<repo>/releases/download/android-cpp-latest/PendulumCpp.apk
      - name: Publish rolling pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-cpp-latest --yes --cleanup-tag || true
          gh release create android-cpp-latest PendulumCpp.apk --prerelease --target "$GITHUB_SHA" \
            --title "Pendulum C++ (Android, latest build of ${GITHUB_REF_NAME})" \
            --notes "Debug-signed APK of the C++ / Qt Quick app (com.adenisov.invertedpendulumcpp) from ${GITHUB_SHA::7}. Installs next to the Python apps."
