name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running run (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Linux is not a primary target. PySide6 6.12 aborts inside Qt in the offscreen GUI tests
    # on Ubuntu + Python 3.10 only (3.12 passes), so that one combination is informational.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.10' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        exclude:
          # macOS minutes cost 10x on private repositories: test macOS on one Python version.
          - os: macos-latest
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies (as documented in INSTALLATION.md)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -v -p no:cacheprovider 2>&1 | tee pytest.log || {
            status=$?
            # Surface the most relevant log lines as annotations (readable without log access).
            grep -nE "Fatal|Error|error|FAILED|Aborted|Segmentation|File \"|PASSED|SKIPPED" pytest.log | tail -n 9 |
              while IFS= read -r line; do echo "::error title=pytest::${line//%/%25}"; done
            pip list 2>/dev/null | grep -iE "pyside6|shiboken|pyqtgraph|numpy|scipy" | tr '\n' ' ' | sed 's/^/::error title=versions::/'; echo
            exit $status
          }

      - name: Launch the application (offscreen smoke test)
        run: |
          set -o pipefail
          python main.py --smoke-test 2 2>&1 | tee smoke.log || {
            status=$?
            tail -n 9 smoke.log | while IFS= read -r line; do echo "::error title=smoke test::${line//%/%25}"; done
            exit $status
          }

      - name: Installable package entry point
        run: |
          python -m pip install .
          pendulum-sim --list-scenarios

      - name: Start script (macOS / Linux)
        if: runner.os != 'Windows' && matrix.python == '3.12'
        run: bash start.sh --smoke-test 2

      - name: Start script (Windows)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: cmd
        run: start.bat --smoke-test 2

  build:
    name: Standalone app (${{ matrix.os }})
    needs: test
    # Standalone builds are slow: run them on main and when started manually (Actions tab).
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python scripts/build_app.py
      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GUI-subsystem executables do not block the shell, so wait explicitly.
          $p = Start-Process -FilePath dist\PendulumSimulator\PendulumSimulator.exe -ArgumentList '--smoke-test','2' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: Smoke-test the built app (macOS)
        if: runner.os == 'macOS'
        run: dist/PendulumSimulator.app/Contents/MacOS/PendulumSimulator --smoke-test 2
      - uses: actions/upload-artifact@v4
        with:
          name: PendulumSimulator-${{ runner.os }}
          path: dist/
          retention-days: 14
