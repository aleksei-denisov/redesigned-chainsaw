name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running run (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Linux is not a primary target. PySide6 6.12 aborts inside Qt in the offscreen GUI tests
    # on Ubuntu + Python 3.10 only (3.12 passes), so that one combination is informational.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.10' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        exclude:
          # macOS minutes cost 10x on private repositories: test macOS on one Python version.
          - os: macos-latest
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies (as documented in INSTALLATION.md)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -v -p no:cacheprovider 2>&1 | tee pytest.log || {
            status=$?
            # Surface the most relevant log lines as annotations (readable without log access).
            grep -nE "Fatal|Error|error|FAILED|Aborted|Segmentation|File \"|PASSED|SKIPPED" pytest.log | tail -n 9 |
              while IFS= read -r line; do echo "::error title=pytest::${line//%/%25}"; done
            pip list 2>/dev/null | grep -iE "pyside6|shiboken|pyqtgraph|numpy|scipy" | tr '\n' ' ' | sed 's/^/::error title=versions::/'; echo
            exit $status
          }

      - name: Launch the application (offscreen smoke test)
        run: |
          set -o pipefail
          python main.py --smoke-test 2 2>&1 | tee smoke.log || {
            status=$?
            tail -n 9 smoke.log | while IFS= read -r line; do echo "::error title=smoke test::${line//%/%25}"; done
            exit $status
          }

      - name: Launch the mobile interface (offscreen smoke test)
        run: python -m pendulum_sim.mobile --smoke-test 2

      - name: Installable package entry point
        run: |
          python -m pip install .
          pendulum-sim --list-scenarios

      - name: Start script (macOS / Linux)
        if: runner.os != 'Windows' && matrix.python == '3.12'
        run: bash start.sh --smoke-test 2

      - name: Start script (Windows)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: cmd
        run: start.bat --smoke-test 2

  build:
    name: Standalone app (${{ matrix.os }})
    needs: test
    # Standalone builds are slow: run them on main and when started manually (Actions tab).
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python scripts/build_app.py
      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GUI-subsystem executables do not block the shell, so wait explicitly.
          $p = Start-Process -FilePath dist\PendulumSimulator\PendulumSimulator.exe -ArgumentList '--smoke-test','2' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: Smoke-test the built app (macOS)
        if: runner.os == 'macOS'
        run: dist/PendulumSimulator.app/Contents/MacOS/PendulumSimulator --smoke-test 2
      - uses: actions/upload-artifact@v4
        with:
          name: PendulumSimulator-${{ runner.os }}
          path: dist/
          retention-days: 14

  mobile-preview:
    name: Mobile UI preview (screenshots + drawing benchmark at 2× pixel ratio)
    runs-on: ubuntu-latest
    permissions:
      contents: write          # publishes the images to the "mobile-preview" pre-release
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "2"     # 1440×900 logical = 2880×1800 pixels, like a Xiaomi Pad 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Render screenshots and benchmark
        run: python scripts/mobile_preview.py build/mobile-preview
      - name: GPU drawing under Xvfb + Mesa (real OpenGL, software rasterised)
        env:
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          PENDULUM_REQUIRE_GPU: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0
          xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest -v -p no:cacheprovider tests/test_mobile_gpu.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-preview
          path: build/mobile-preview/*.*
      - name: Publish to the mobile-preview pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/android-apk' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-ux' || github.ref == 'refs/heads/mobile-polish')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/mobile-ux' && 'mobile-ux-preview' || github.ref == 'refs/heads/mobile-polish' && 'mobile-polish-preview' || 'mobile-preview' }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/mobile-preview/*.png build/mobile-preview/benchmark.txt \
            --prerelease --target "$GITHUB_SHA" --title "Mobile UI preview (${GITHUB_SHA::7})" \
            --notes "Offscreen renderings of the Android interface at a 2× pixel ratio, and drawing timings. Generated by CI."

  quick-preview:
    name: Qt Quick app (smoke test, screenshots and performance test under Xvfb + Mesa)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write          # publishes the screenshots and report to a pre-release
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"          # real OpenGL scene graph, software rasterised
      PENDULUM_BENCH_SECONDS: "1.5"
      RUN: /tmp/run-quick                 # xvfb, faulthandler, and a stack dump after 120 s instead of a hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries, Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          printf '%s\n' '#!/bin/bash' \
            'timeout -s ABRT 120 xvfb-run -a -s "-screen 0 1280x800x24" python -X faulthandler -m pendulum_sim.quick "$@"' \
            'status=$?' \
            'if [ $status -ne 0 ]; then d=${PENDULUM_QUICK_DIAG:-$HOME/.cache/pendulum-quick}; echo "--- start.log"; cat "$d/start.log"; echo "--- fault.log"; cat "$d/fault.log"; fi' \
            'exit $status' \
            > /tmp/run-quick
          chmod +x /tmp/run-quick
          cat /tmp/run-quick
      - name: Smoke test – every screen, both themes (any QML warning fails)
        run: $RUN --smoke-test 3 --strict
      - name: Smoke test with the physics in a thread
        run: $RUN --smoke-test 3 --strict --physics thread
      - name: Smoke test with Qt's basic render loop (rendering on the GUI thread, as on the Pad 6)
        env:
          QSG_RENDER_LOOP: basic
        run: $RUN --smoke-test 3 --strict
      - name: Side-panel edits through the tile editor (move, add, remove, update)
        env:
          QSG_RENDER_LOOP: basic
        run: |
          $RUN --strict --panel-stress 60 || {
            echo "::group::native backtrace (gdb)"
            sudo apt-get install -y gdb > /dev/null
            timeout -s KILL 150 xvfb-run -a -s "-screen 0 1280x800x24" gdb -q -batch -ex "set follow-fork-mode parent" -ex "set detach-on-fork on" -ex run \
              -ex "bt 60" -ex "info threads" --args python -X faulthandler -m pendulum_sim.quick --strict --panel-stress 60
            echo "::endgroup::"
            exit 1
          }
          $RUN --strict --panel-stress 60 --stress-gc
          QSG_RENDER_LOOP=threaded $RUN --strict --panel-stress 60 --stress-gc
          mkdir -p build/quick-preview
          $RUN --strict --graph-stress 50 --graph-stress-dir build/quick-preview \
            || echo "::warning title=graph stress::a graph card stayed blank after a window / smoothing change"
      - name: Start-up journal and safe mode after an unfinished start
        env:
          PENDULUM_QUICK_DIAG: ${{ runner.temp }}/diag
        run: |
          mkdir -p "$PENDULUM_QUICK_DIAG" build/quick-preview
          printf '  0.001  start\n  0.002  step  0.30 s  loading screen shown\n' > "$PENDULUM_QUICK_DIAG/start.log"
          $RUN --strict --safe-mode-preview --screenshot build/quick-preview/safe-mode.png
          grep -q "start complete\|loading screen" "$PENDULUM_QUICK_DIAG/start.log"
      - name: Screenshots
        run: |
          mkdir -p build/quick-preview
          for theme in light dark; do
            for screen in simulate graphs controller model autotune experiments settings; do
              $RUN --strict --theme $theme --screen $screen --screenshot build/quick-preview/$screen-$theme.png
            done
          done
          $RUN --strict --scenario double_fixed_lqr --screenshot build/quick-preview/simulate-double-fixed.png || true
          for panel in edit value graph; do
            $RUN --strict --theme dark --panel $panel --screenshot build/quick-preview/panel-$panel-dark.png
          done
          $RUN --strict --theme light --panel graph --screenshot build/quick-preview/panel-graph-light.png
          $RUN --strict --theme dark --autotune running --screenshot build/quick-preview/autotune-running-dark.png
          $RUN --strict --theme dark --experiments --screenshot build/quick-preview/experiments-runs-dark.png
          $RUN --strict --theme light --experiments --screenshot build/quick-preview/experiments-runs-light.png
          $RUN --strict --theme light --autotune result --screenshot build/quick-preview/autotune-result-light.png
      - name: Performance test
        if: always()
        run: |
          set -o pipefail
          $RUN --benchmark | tee build/quick-preview/performance.txt || {
            status=$?
            echo "::error title=quick performance test::stopped with status $status; report saved so far:"
            cat ~/.local/share/pendulum-sim/*/quick_performance_report.txt || true
            exit $status
          }
      - name: Performance test (threaded render loop)
        if: always()
        env:
          QSG_RENDER_LOOP: threaded
        run: |
          set -o pipefail
          $RUN --benchmark | tee build/quick-preview/performance-threaded.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-preview
          path: build/quick-preview/*.*
      - name: Publish to the qtquick-ui-preview pre-release
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/qtquick-ui' || github.ref == 'refs/heads/quick-core-v2')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/quick-core-v2' && 'quick-core-v2-preview' || 'qtquick-ui-preview' }}
        run: |
          shopt -s nullglob
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/quick-preview/*.png build/quick-preview/*.txt \
            --prerelease --target "$GITHUB_SHA" --title "Qt Quick app preview (${GITHUB_SHA::7})" \
            --notes "Screenshots of the Qt Quick app and its performance report on the CI machine (software-rasterised OpenGL, so the frame rates say nothing about a tablet). Generated by CI."
